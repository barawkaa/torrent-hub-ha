name: Verify Torrent Hub (manual)
on:
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install fastapi uvicorn 'httpx[socks]' pytest
      - run: python -m compileall -q torrent-hub/app
      - run: pytest -q tests
      - run: python -c "import re,pathlib; s=pathlib.Path('torrent-hub/app/static/index.html').read_text();pathlib.Path('/tmp/torrent-hub-ui.js').write_text(re.search(r'<script>(.*)</script>',s,re.S).group(1))"
      - run: node --check /tmp/torrent-hub-ui.js
