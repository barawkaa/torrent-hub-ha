name: Verify Torrent Hub
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install fastapi uvicorn 'httpx[socks]' pytest
      - run: python -m compileall -q torrent-hub/app
      - run: pytest -q tests
      - run: python -c "import re,pathlib; s=pathlib.Path('torrent-hub/app/static/index.html').read_text();pathlib.Path('/tmp/torrent-hub-ui.js').write_text(re.search(r'<script>(.*)</script>',s,re.S).group(1))"
      - run: node --check /tmp/torrent-hub-ui.js
  arm64-image:
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build ARM64 add-on image
        uses: docker/build-push-action@v6
        with:
          context: ./torrent-hub
          platforms: linux/arm64
          push: false
          provenance: false
