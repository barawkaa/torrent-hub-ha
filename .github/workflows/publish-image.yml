name: Publish prebuilt ARM64 image
on:
  push:
    branches:
      - release/prebuilt-1.1.3
    paths:
      - 'torrent-hub/**'
      - '.github/workflows/publish-image.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check code and UI
        run: |
          python -m pip install fastapi uvicorn 'httpx[socks]' pytest
          python -m compileall -q torrent-hub/app
          python -m pytest -q tests
          python -c "import re,pathlib; s=pathlib.Path('torrent-hub/app/static/index.html').read_text();pathlib.Path('/tmp/torrent-hub-ui.js').write_text(re.search(r'<script>(.*)</script>',s,re.S).group(1))"
          node --check /tmp/torrent-hub-ui.js
  image:
    runs-on: ubuntu-24.04-arm
    needs: checks
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: ./torrent-hub
          platforms: linux/arm64
          load: true
          push: false
          provenance: false
          tags: ghcr.io/barawkaa/torrent-hub-ha:1.1.3
          build-args: |
            BUILD_VERSION=1.1.3
      - name: Smoke test container before publishing
        timeout-minutes: 4
        run: sh scripts/smoke_container.sh ghcr.io/barawkaa/torrent-hub-ha:1.1.3
      - name: Publish tested image
        run: docker push ghcr.io/barawkaa/torrent-hub-ha:1.1.3
