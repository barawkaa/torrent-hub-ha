name: Validate Torrent Hub 3.2.0 and Android 1.1.0
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-and-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify backend and browser scripts
        run: |
          python -m pip install -r torrent-hub/requirements.txt pytest
          python -m compileall -q torrent-hub/app
          python -m pytest -q tests/test_release3.py tests/test_live_engine.py tests/test_product_contract.py tests/test_tracker_login.py tests/test_release32.py
          python - <<'PY'
          import pathlib,re
          page=pathlib.Path('torrent-hub/app/static/index.html').read_text()
          script=re.search(r'<script>(.*)</script>',page,re.S)
          assert script, 'Main JavaScript missing'
          pathlib.Path('/tmp/torrent-hub-inline.js').write_text(script.group(1))
          assert 'src="filters.js"' in page
          assert 'advancedSearch' not in page
          assert 'Данные предыдущей версии' not in page
          PY
          node --check /tmp/torrent-hub-inline.js
          node --check torrent-hub/app/static/filters.js
          node scripts/test_search_filters.js
      - name: Probe current public APIs (diagnostic only)
        run: |
          python - <<'PY'
          import httpx,time
          probes=[('jac.black','https://jac.black/api/v1.0/torrents',{'search':'Интерстеллар'}),
                  ('Knaben v2','https://api.knaben.org/v2/search',{'q':'Interstellar','s':5})]
          for name,url,params in probes:
              t=time.monotonic()
              try:
                  with httpx.Client(timeout=8,follow_redirects=False) as client:
                      r=client.get(url,params=params)
                  print(name,'HTTP',r.status_code,'ms',round((time.monotonic()-t)*1000),
                        'content-type',r.headers.get('content-type',''),flush=True)
                  if r.is_success:
                      try:
                          obj=r.json()
                          print(name,'result-shape',type(obj).__name__,
                                ('keys='+','.join(map(str,list(obj)[:12])) if isinstance(obj,dict)
                                 else 'items='+str(len(obj))),flush=True)
                      except ValueError:
                          print(name,'body is not JSON',flush=True)
              except Exception as e:
                  print(name,type(e).__name__,str(e)[:180],flush=True)
          PY
  android-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile Android 9-compatible app and test URI parsing
        run: |
          cd android
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Validate compilation artifact (not a public release)
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t android/app/build/outputs/apk/debug/app-debug.apk >/dev/null
  arm64-smoke:
    runs-on: ubuntu-24.04-arm
    needs: backend-and-ui
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ARM64 Home Assistant app
        uses: docker/build-push-action@v6
        with:
          context: ./torrent-hub
          platforms: linux/arm64
          load: true
          push: false
          provenance: false
          tags: torrent-hub-candidate:3.2.0
          build-args: |
            BUILD_VERSION=3.2.0
      - name: Smoke test live HTTP interfaces without external trackers
        run: |
          docker run -d --name th-candidate --tmpfs /data:rw,size=64m -p 18766:8766 torrent-hub-candidate:3.2.0
          trap 'docker logs --tail 90 th-candidate || true; docker rm -f th-candidate || true' EXIT
          for n in $(seq 1 20); do
            if curl -fsS --max-time 3 http://127.0.0.1:18766/healthz >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18766/filters.js | grep -q 'TorrentFilters'
          curl -fsS http://127.0.0.1:18766/api/config | python3 -c 'import json,sys; c=json.load(sys.stdin); assert c["smart"]["min_size"]==7 and c["smart"]["max_size"]==150'
          curl -fsS http://127.0.0.1:18766/ | grep -q 'resultFilters'
