name: Publish Home Assistant Torrent Hub 3.4.0
on:
  push:
    branches: [main]
    paths:
      - 'torrent-hub/**'
      - 'scripts/test_release33_ui.js'
      - 'tests/test_release34.py'
      - '.github/workflows/publish-ha-3.4.0.yml'
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify backend and offline filtering
        run: |
          python -m pip install -r torrent-hub/requirements.txt pytest
          python -m pytest -q tests/test_release3.py tests/test_live_engine.py tests/test_product_contract.py tests/test_tracker_login.py tests/test_release32.py tests/test_release34.py
          python -m compileall -q torrent-hub/app
          node scripts/test_search_filters.js
          npm install --no-save jsdom@27
          node scripts/test_release33_ui.js
  publish-arm64:
    runs-on: ubuntu-24.04-arm
    needs: verify
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ARM64 versioned image
        uses: docker/build-push-action@v6
        with:
          context: ./torrent-hub
          platforms: linux/arm64
          load: true
          push: false
          provenance: false
          tags: ghcr.io/barawkaa/torrent-hub-ha:3.4.0
          build-args: |
            BUILD_VERSION=3.4.0
      - name: Smoke test before publishing
        run: |
          docker run -d --name th32 --tmpfs /data:rw,size=64m -p 18766:8766 ghcr.io/barawkaa/torrent-hub-ha:3.4.0
          trap 'docker logs --tail 70 th32 || true; docker rm -f th32 || true' EXIT
          for n in $(seq 1 20); do
            if curl -fsS --max-time 3 http://127.0.0.1:18766/healthz >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18766/api/config | python3 -c 'import json,sys;c=json.load(sys.stdin);assert c["smart"]["min_size"]==7 and c["smart"]["max_size"]==150 and len([s for s in c["sources"] if s["id"] in ("torapi","torlock","jacred-su")])==3'
          curl -fsS http://127.0.0.1:18766/filters.js | grep -q 'TorrentFilters'
          test "$(docker image inspect ghcr.io/barawkaa/torrent-hub-ha:3.4.0 --format '{{index .Config.Labels "io.hass.version"}}')" = 3.4.0
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested ARM64 image
        run: docker push ghcr.io/barawkaa/torrent-hub-ha:3.4.0
      - name: Confirm public image download
        run: |
          docker logout ghcr.io
          docker image rm ghcr.io/barawkaa/torrent-hub-ha:3.4.0
          docker pull ghcr.io/barawkaa/torrent-hub-ha:3.4.0
          docker image inspect ghcr.io/barawkaa/torrent-hub-ha:3.4.0 --format '{{.Architecture}} {{index .Config.Labels "io.hass.version"}}'

      - name: Record GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if ! gh release view ha-v3.4.0 >/dev/null 2>&1; then
            gh release create ha-v3.4.0 --target "$GITHUB_SHA" \
              --title "Torrent Hub Home Assistant 3.4.0" \
              --notes "Готовая версия Home Assistant OS ARM64. Исправлено отображение результатов поиска и ошибка smartEnabled. Образ ghcr.io/barawkaa/torrent-hub-ha:3.4.0."
          fi
