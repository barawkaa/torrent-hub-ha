name: Publish signed Android 1.1.0 APK
on:
  workflow_dispatch:
  push:
    tags: [android-v1.1.0]
permissions:
  contents: write
jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore permanent private signing key
        env:
          KEY_B64: ${{ secrets.TORRENTHUB_RELEASE_KEYSTORE_B64 }}
          TORRENTHUB_KEYSTORE_PASSWORD: ${{ secrets.TORRENTHUB_KEYSTORE_PASSWORD }}
          TORRENTHUB_KEY_ALIAS: ${{ secrets.TORRENTHUB_KEY_ALIAS }}
          TORRENTHUB_KEY_PASSWORD: ${{ secrets.TORRENTHUB_KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$KEY_B64" || { echo 'Release signing key is missing'; exit 1; }
          test -n "$TORRENTHUB_KEYSTORE_PASSWORD"
          test -n "$TORRENTHUB_KEY_ALIAS"
          test -n "$TORRENTHUB_KEY_PASSWORD"
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/torrent-hub-release.jks"
          chmod 600 "$RUNNER_TEMP/torrent-hub-release.jks"
          echo "TORRENTHUB_KEYSTORE_FILE=$RUNNER_TEMP/torrent-hub-release.jks" >> "$GITHUB_ENV"
          echo "TORRENTHUB_KEYSTORE_PASSWORD=$TORRENTHUB_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "TORRENTHUB_KEY_ALIAS=$TORRENTHUB_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "TORRENTHUB_KEY_PASSWORD=$TORRENTHUB_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Test and compile signed non-debug APK
        run: |
          cd android
          gradle :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace
      - name: Verify signature and Android version metadata
        run: |
          set -eu
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          signer=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print -quit)
          test -n "$signer"
          "$signer" verify --verbose --print-certs "$APK"
          unzip -t "$APK" >/dev/null
          cp "$APK" torrent-hub-android-1.1.0-release.apk
          sha256sum torrent-hub-android-1.1.0-release.apk > SHA256SUMS
      - name: Publish final GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          tag=android-v1.1.0
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" \
              --title "Torrent Hub Android 1.1.0" \
              --notes "Signed Android release. Android 9 and Android 15 support; mouse-capable WebView; LAN/external server profiles."
          fi
          gh release upload "$tag" torrent-hub-android-1.1.0-release.apk SHA256SUMS --clobber
