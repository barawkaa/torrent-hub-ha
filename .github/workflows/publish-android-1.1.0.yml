name: Publish Torrent Hub Android 1.1.0 Debug APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-android-1.1.0.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-debug-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Android 9+ APK (debug-signed, no secrets)
        run: |
          cd android
          gradle :app:assembleDebug --no-daemon
      - name: Validate APK and signature
        run: |
          set -eu
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          signer=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print -quit || true)
          if test -n "$signer"; then
            "$signer" verify --verbose "$APK"
          else
            jarsigner -verify "$APK" > /tmp/torrent-hub-signature.txt
            grep -q "jar verified" /tmp/torrent-hub-signature.txt
          fi
          cp "$APK" torrent-hub-android-1.1.0-debug.apk
          sha256sum torrent-hub-android-1.1.0-debug.apk > SHA256SUMS
      - name: Publish permanent downloadable APK in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG="android-v1.1.0-debug"
          ASSET="torrent-hub-android-1.1.0-debug.apk"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "$ASSET" SHA256SUMS \
              --target "$GITHUB_SHA" \
              --title "Torrent Hub Android 1.1.0 (Debug APK)" \
              --notes "Установочный APK для личного использования на обычных Android-приставках Ugoos (Android 9, мышь) и телефонах (Android 15). Home Assistant Torrent Hub: исправление системных отступов, локальный и внешний адрес в профиле, выбор доступного адреса. Не требует подписи или сборки со стороны пользователя. Debug-подпись; это не production/release signing, при смене сертификата может потребоваться переустановка." \
              --prerelease
          else
            gh release upload "$TAG" "$ASSET" SHA256SUMS --clobber
          fi
