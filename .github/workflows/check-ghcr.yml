name: Check anonymous pull of published image
on:
  push:
    branches:
      - release/prebuilt-1.1.3
    paths:
      - '.github/workflows/check-ghcr.yml'
permissions:
  contents: read
jobs:
  anonymous-pull:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 4
    steps:
      - name: Pull published ARM64 image without credentials
        run: |
          docker logout ghcr.io || true
          docker pull ghcr.io/barawkaa/torrent-hub-ha:1.1.3
          docker image inspect ghcr.io/barawkaa/torrent-hub-ha:1.1.3 --format '{{.Architecture}} {{index .Config.Labels "io.hass.version"}} {{index .Config.Labels "io.hass.arch"}}'
