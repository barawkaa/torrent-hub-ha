name: Final Torrent Hub 3.0 acceptance and ARM64 image
on:
  push:
    branches: [release/3.0-mobile-smart]
    paths:
      - '.github/workflows/final-v3.yml'
permissions:
  contents: read
  packages: write
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Backend tests and manifest
        run: |
          python -m pip install -r torrent-hub/requirements.txt pytest PyYAML
          python -m compileall -q torrent-hub/app
          python -m pytest -q tests/test_release3.py tests/test_live_engine.py tests/test_product_contract.py
          python - <<'PY'
          import yaml,json,pathlib
          c=yaml.safe_load(pathlib.Path('torrent-hub/config.yaml').read_text())
          assert c['ingress_port']==8765
          assert c['ports']['8766/tcp']==8766
          assert 'media' in str(c['map'])
          m=json.loads(pathlib.Path('torrent-hub/app/static/manifest.webmanifest').read_text())
          assert m['display']=='standalone'
          print('PASS manifest and configuration')
          PY
      - name: Browser DOM and JS contract
        run: |
          npm install --no-save jsdom@27
          node scripts/test_mobile_ui.js
  arm64:
    runs-on: ubuntu-24.04-arm
    needs: tests
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build executable image
        uses: docker/build-push-action@v6
        with:
          context: ./torrent-hub
          platforms: linux/arm64
          load: true
          push: false
          provenance: false
          tags: ghcr.io/barawkaa/torrent-hub-ha:3.0.0
          build-args: |
            BUILD_VERSION=3.0.0
      - name: Validate ingress, private gateway, direct live search and RAM cache
        timeout-minutes: 5
        run: |
          docker run -d --name th-v3 --tmpfs /data:rw,size=64m -p 18765:8765 -p 18766:8766 ghcr.io/barawkaa/torrent-hub-ha:3.0.0
          for n in $(seq 1 20); do
            if curl -fsS --max-time 3 http://127.0.0.1:18765/healthz >/dev/null; then break; fi
            sleep 2
          done
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          a='http://127.0.0.1:18765'
          b='http://127.0.0.1:18766'
          def req(url, method='GET', obj=None):
              data=json.dumps(obj).encode() if obj is not None else None
              q=urllib.request.Request(url,method=method,data=data,headers={'Content-Type':'application/json'})
              with urllib.request.urlopen(q,timeout=110) as r:return json.load(r)
          assert req(a+'/healthz')['ok']
          try:
              req(b+'/api/config')
              raise AssertionError('Public unauthenticated API!')
          except urllib.error.HTTPError as e:assert e.code==401
          with urllib.request.urlopen(b+'/login',timeout=10) as r:assert r.status==200
          with urllib.request.urlopen(b+'/manifest.webmanifest',timeout=10) as r: assert 'application/' in r.headers['Content-Type']
          req(a+'/api/config','PUT',{'config':{'proxy':{'mode':'direct'}}})
          z=req(a+'/api/search','POST',{'query':'Титаник','include_public':False})
          print('LIVE PROVIDERS',[(x['id'],x['count']) for x in z['providers']],flush=True)
          assert len(z['providers'])==3
          assert sum(x['count']>0 for x in z['providers'])>=2, 'Two live direct trackers required'
          assert any(x['magnet'].startswith('magnet:?xt=') for x in z['items'] if x.get('magnet'))
          assert req(a+'/api/cache')['disk_database_bytes']==0
          assert req(a+'/api/cache','DELETE')['cache']['results']==0
          print('PASS: no public unauthenticated API, live search without aggregators, RAM-only cache',flush=True)
          PY
      - name: Publish only fully tested image
        if: success()
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push verified version
        if: success()
        run: docker push ghcr.io/barawkaa/torrent-hub-ha:3.0.0
      - name: Verify anonymous pull
        if: success()
        run: |
          docker logout ghcr.io || true
          docker image rm ghcr.io/barawkaa/torrent-hub-ha:3.0.0
          docker pull ghcr.io/barawkaa/torrent-hub-ha:3.0.0
          docker image inspect ghcr.io/barawkaa/torrent-hub-ha:3.0.0 --format '{{.Architecture}} {{index .Config.Labels "io.hass.version"}}'
      - name: Container logs on failure
        if: failure()
        run: docker logs --tail 80 th-v3 || true
