name: One-time live Torrent Hub 2.0 acceptance
on:
  push:
    branches: [feature/direct-search-2.0]
    paths: ['.github/workflows/live-acceptance.yml']
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./torrent-hub
          platforms: linux/arm64
          load: true
          tags: th-live-accept:arm64
          provenance: false
      - name: Start without FileDB or Prowlarr
        run: |
          docker run -d --name th-live -p 18765:8765 --tmpfs /data:rw,size=48m th-live-accept:arm64
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:18765/healthz >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS -X PUT http://127.0.0.1:18765/api/config -H 'Content-Type: application/json' -d '{"config":{"proxy":{"mode":"direct"}}}' >/dev/null
      - name: Run true Internet search in container (NO AGGREGATORS)
        timeout-minutes: 3
        run: |
          python - <<'PY'
          import requests
          b='http://127.0.0.1:18765/api'
          result=requests.post(b+'/search',json={'query':'Титаник','include_public':False},timeout=95).json()
          print('PROVIDERS',[(p['name'],p['count'],p.get('message','')[:80]) for p in result['providers']],flush=True)
          data=result['items']
          print('MERGED',len(data),'MAGNETS',sum(bool(x.get('magnet')) for x in data),'SAMPLE',data[0]['title'][:70] if data else '',flush=True)
          assert len(result['providers'])==3
          assert all(p['id'].startswith('direct:') for p in result['providers'])
          assert sum(p['count']>0 for p in result['providers'])>=2, 'Less than two working direct sites'
          assert len(data)>0 and any(x.get('magnet','').startswith('magnet:?xt=') for x in data)
          cache=requests.get(b+'/cache').json()
          print('CACHE',cache,flush=True)
          assert cache['disk_database_bytes']==0
          cleared=requests.delete(b+'/cache').json()
          assert cleared['cache']['results']==0
          print('PASS: independent live search, valid magnet, RAM cache clear',flush=True)
          PY
      - name: Diagnostics on failure
        if: failure()
        run: docker logs --tail 65 th-live
