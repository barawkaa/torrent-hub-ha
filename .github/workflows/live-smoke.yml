name: Validate direct search prototype
on:
  push:
    branches: [feature/direct-search-2.0]
    paths: ['.github/workflows/live-smoke.yml']
permissions:
  contents: read
jobs:
  logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r torrent-hub/requirements.txt pytest
      - run: python -m compileall -q torrent-hub/app
      - run: pytest -q tests/test_live_engine.py
      - run: python -c "import re,pathlib; s=pathlib.Path('torrent-hub/app/static/index.html').read_text();pathlib.Path('/tmp/torrent-hub-ui.js').write_text(re.search(r'<script>(.*)</script>',s,re.S).group(1))"
      - run: node --check /tmp/torrent-hub-ui.js
  arm64:
    runs-on: ubuntu-24.04-arm
    needs: logic
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./torrent-hub
          platforms: linux/arm64
          load: true
          tags: torrent-hub-live-test:arm64
          provenance: false
      - name: Smoke startup
        run: |
          docker run -d --name th-live --tmpfs /data:rw,size=48m -p 18765:8765 torrent-hub-live-test:arm64
          for i in $(seq 1 15); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:18765/healthz | grep -q true; then
              echo "PASS: Live-only backend running on ARM64"
              docker rm -f th-live
              exit 0
            fi
            sleep 2
          done
          docker logs th-live
          docker rm -f th-live
          exit 1
