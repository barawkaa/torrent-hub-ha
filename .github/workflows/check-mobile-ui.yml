name: Check mobile interface behavior
on:
  push:
    branches: [release/3.0-mobile-smart]
    paths: ['.github/workflows/check-mobile-ui.yml']
permissions:
  contents: read
jobs:
  browser-behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save jsdom@27
      - run: node scripts/test_mobile_ui.js
