name: Publish Torrent Hub 2.0 ARM64 prebuilt
on:
  push:
    branches: [release/prebuilt-live-2.0]
    paths: ['.github/workflows/publish-v2.yml']
permissions:
  contents: read
  packages: write
jobs:
  release:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./torrent-hub
          platforms: linux/arm64
          load: true
          push: false
          tags: ghcr.io/barawkaa/torrent-hub-ha:2.0.0
          provenance: false
          build-args: |
            BUILD_VERSION=2.0.0
      - name: Start and verify independent real search
        timeout-minutes: 4
        run: |
          docker run -d --name torrent-hub-accept --tmpfs /data:rw,size=48m -p 18765:8765 ghcr.io/barawkaa/torrent-hub-ha:2.0.0
          for n in $(seq 1 15); do
            if curl -sf http://127.0.0.1:18765/healthz >/dev/null; then break; fi
            sleep 2
          done
          python3 - <<'PY'
          import json,urllib.request
          base="http://127.0.0.1:18765/api/"
          def request(path, method="GET", data=None):
              raw=json.dumps(data).encode() if data is not None else None
              req=urllib.request.Request(base+path,data=raw,method=method,headers={"Content-Type":"application/json"})
              with urllib.request.urlopen(req,timeout=95) as r:return json.load(r)
          request("config","PUT",{"config":{"proxy":{"mode":"direct"}}})
          result=request("search","POST",{"query":"Титаник","include_public":False})
          print("DIRECT SOURCES:", [(x["id"],x["count"]) for x in result["providers"]], flush=True)
          assert len(result["providers"])==3 and all(x["id"].startswith("direct:") for x in result["providers"])
          assert sum(x["count"]>0 for x in result["providers"])>=2, "Live direct tracker query failed"
          assert any(x.get("magnet","").startswith("magnet:?xt=") for x in result["items"])
          assert request("storage")["current_search_database_bytes"]==0
          assert request("cache")["disk_database_bytes"]==0
          assert request("cache","DELETE")["cache"]["results"]==0
          print("PASS: 2+ direct providers, no search aggregator, magnet, RAM-only cache", flush=True)
          PY
          docker rm -f torrent-hub-accept
      - name: Publish tested image
        run: docker push ghcr.io/barawkaa/torrent-hub-ha:2.0.0
      - name: Check anonymous image download
        run: |
          docker logout ghcr.io || true
          docker image rm ghcr.io/barawkaa/torrent-hub-ha:2.0.0
          docker pull ghcr.io/barawkaa/torrent-hub-ha:2.0.0
          docker image inspect ghcr.io/barawkaa/torrent-hub-ha:2.0.0 --format '{{.Architecture}} {{index .Config.Labels "io.hass.version"}}'
      - name: Container log on failure
        if: failure()
        run: docker logs --tail 80 torrent-hub-accept || true
