plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.barawkaa.torrenthub'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.barawkaa.torrenthub'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            // Configure only via CI secrets or a local untracked environment.
            def path = System.getenv('TORRENTHUB_KEYSTORE_FILE')
            if (path != null && !path.isEmpty()) {
                storeFile file(path)
                storePassword System.getenv('TORRENTHUB_KEYSTORE_PASSWORD')
                keyAlias System.getenv('TORRENTHUB_KEY_ALIAS')
                keyPassword System.getenv('TORRENTHUB_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            signingConfig signingConfigs.release
        }
        debug {
            debuggable true
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
